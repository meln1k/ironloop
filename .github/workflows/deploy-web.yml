name: Deploy web

# Publishes the wasm visualizer to GitHub Pages on every push to main that
# can change it (https://meln1k.github.io/ironloop/).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "scripts/build-web.sh"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The CLI must match the wasm-bindgen crate version pinned in
      # Cargo.lock; resolve it from there instead of pinning it twice.
      - name: Resolve wasm-bindgen version
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;p;}' Cargo.lock | cut -d'"' -f2)
          echo "BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
          echo "wasm-bindgen $version"
      - name: Fetch wasm-bindgen-cli
        run: |
          dir="wasm-bindgen-$BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$BINDGEN_VERSION/$dir.tar.gz" | tar -xz -C /tmp
          install -m 755 "/tmp/$dir/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      # scripts/build-web.sh builds ironloop-viz for wasm and runs
      # wasm-bindgen into web/pkg next to web/index.html.
      - name: Build the wasm app
        run: scripts/build-web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
